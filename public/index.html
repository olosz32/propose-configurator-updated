function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function fd(d){return d?d.getDate()+" "+MO[d.getMonth()]+" "+d.getFullYear():"";}
function fds(a){return a.sort(function(x,y){return x-y}).map(fd).join(", ");}

var S={step:0,decor:null,loc:null,extras:[],dates:[],form:{name:"",email:"",phone:"",msg:""},done:false,sending:false,cY:new Date().getFullYear(),cM:new Date().getMonth()};

function disc(){
  if(S.extras.length<3)return{id:null,amt:0};
  var sorted=S.extras.slice().sort(function(a,b){return a.price-b.price});
  return{id:sorted[0].id,amt:Math.round(sorted[0].price/2)};
}
function tot(){return(S.decor?S.decor.price:0)+(S.loc?S.loc.price:0)+S.extras.reduce(function(s,e){return s+e.price},0)-disc().amt;}
function ok(){
  if(S.step===0){
    if(!S.decor)return false;
    if(S.decor.variants&&!S.decor.variant)return false;
    return true;
  }
  if(S.step===1)return!!S.loc;
  if(S.step===2)return true;
  if(S.step===3)return S.form.name&&S.form.email&&S.dates.length>0;
  return false;
}

      h+='<div class="bg" style="background:'+(l.pub?"rgba(26,58,92,.8)":"rgba(92,26,58,.8)")+'">'+(l.pub?"PUBLIC":"PRIVATE")+'</div>';
      if(l.id==="robinson")h+='<div class="bg" style="left:auto;right:8px;background:rgba(0,0,0,.6)">MIN. SPEND</div>';
      h+='<div class="cb"><h3>'+esc(l.name)+'</h3><p>'+esc(l.desc)+'</p><div class="pr">'+l.pl+'</div></div></div>';
    });
    h+='</div>';
  }

  if(S.step===2){
    var di=disc();
    var isPub=S.loc&&S.loc.pub===true;
    if(S.extras.length===2)h+='<div class="promo">🎉 Add one more service and get 50% off the cheapest one!</div>';
    if(S.extras.length>=3){
      var dn=E.filter(function(e){return e.id===di.id})[0];
      h+='<div class="promo">🎉 50% discount applied on '+(dn?esc(dn.name):"")+'! You save '+fm(di.amt)+'</div>';
    }
    h+='<div class="g3">';
    E.forEach(function(ex){
      var sel=S.extras.filter(function(e){return e.id===ex.id}).length>0;
      var isD=di.id===ex.id;
      var blocked=ex.id==="cold-spark"&&isPub;
      h+='<div class="ec'+(sel?" s":"")+'" '+(blocked?'':'onclick="tE(\''+ex.id+'\')"')+' style="'+(blocked?"opacity:.5;cursor:not-allowed":"")+'">';
      if(sel)h+='<div class="ck">'+CK+'</div>';
      if(isD)h+='<div style="position:absolute;top:8px;left:8px;background:#3b6d11;color:#fff;font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px">-50%</div>';
      h+='<div style="margin-bottom:10px">'+eico(ex.icon)+'</div>';
      h+='<h3>'+esc(ex.name)+'</h3><p>'+esc(ex.desc)+'</p>';
      if(blocked)h+='<div style="color:#c0392b;font-size:11px;font-weight:500;margin-bottom:6px">Private venues only</div>';
      if(isD)h+='<div class="ep"><span style="text-decoration:line-through;color:#888;font-size:14px">'+fm(ex.price)+'</span> '+fm(Math.round(ex.price/2))+'</div>';
      else h+='<div class="ep">'+fm(ex.price)+'</div>';
      h+='</div>';
    });
    h+='</div>';
  }

  if(S.step===3){
    h+='<div class="sum">';
    h+='<div class="sr"><div><div style="font-size:13px;font-weight:500;color:#888">Decoration</div><div style="font-weight:500">'+esc(S.decor.name)+(S.decor.variant?' <span style="color:#378add">('+esc(S.decor.variant)+')</span>':'')+'</div></div><div style="font-weight:500">'+fm(S.decor.price)+'</div></div>';
    h+='<div class="sr"><div><div style="font-size:13px;font-weight:500;color:#888">Location</div><div style="font-weight:500">'+esc(S.loc.name)+'</div></div><div style="font-weight:500">'+S.loc.pl+'</div></div>';
    if(S.extras.length){
      var di=disc();
      h+='<div style="margin-bottom:8px"><div style="font-size:13px;font-weight:500;color:#888;margin-bottom:4px">Extras</div>';
      S.extras.forEach(function(ex){
        var isD=di.id===ex.id;
        h+='<div style="display:flex;justify-content:space-between;font-size:13px;padding-left:8px;margin-bottom:3px"><span>'+esc(ex.name)+(isD?' <span style="color:#3b6d11;font-weight:500">(-50%)</span>':'')+'</span><span style="color:#888">'+(isD?'<s>'+fm(ex.price)+'</s> '+fm(Math.round(ex.price/2)):fm(ex.price))+'</span></div>';
      });
      h+='</div>';
    }
    h+='<div class="st"><span style="font-size:16px;font-weight:500">Estimated total</span><span>'+fm(tot())+'</span></div></div>';

    h+='<div style="margin-bottom:20px"><label style="font-size:14px;font-weight:500;display:block;margin-bottom:4px">Select your preferred dates *</label><div style="font-size:12px;color:#888;margin-bottom:8px">Tap to select one or more dates</div>';
    h+=calHTML();
    if(S.dates.length)h+='<div style="font-size:13px;color:#378add;margin-top:8px;font-weight:500">Selected: '+fds(S.dates)+'</div>';
    h+='</div>';

    h+='<div class="fld"><label>Your name *</label><input type="text" value="'+esc(S.form.name)+'" oninput="S.form.name=this.value;ub()" placeholder="John Smith"></div>';
    h+='<div class="fld"><label>Email address *</label><input type="email" value="'+esc(S.form.email)+'" oninput="S.form.email=this.value;ub()" placeholder="john@example.com"></div>';
    h+='<div class="fld"><label>Phone / WhatsApp</label><input type="tel" value="'+esc(S.form.phone)+'" oninput="S.form.phone=this.value" placeholder="+44 7xxx xxx xxx"></div>';
    h+='<div class="fld"><label>Anything else?</label><textarea rows="3" oninput="S.form.msg=this.value" placeholder="Special requests, song preferences...">'+esc(S.form.msg)+'</textarea></div>';
  }

  h+='<div class="btm"'+(S.sending?' style="opacity:.6;pointer-events:none"':'')+'><div>'+(S.step>0?'<button class="bb" onclick="bk()">Back</button>':'')+'</div>';
  h+='<div style="display:flex;align-items:center;gap:16px"><div style="text-align:right"><div style="font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.5px">'+(S.step<3?"Running total":"Estimated total")+'</div><div style="font-size:22px;font-weight:500">'+fm(tot())+'</div></div>';
  h+='<button class="bn" id="nb" '+(ok()?"":"disabled")+' onclick="'+(S.step<3?"nx()":"sub()")+'">'+(S.step<3?"Next":"Submit request")+'</button>';
  h+='</div></div>';

  h+='<div class="cta">Looking for something special? <a href="https://wa.me/36308996525?text=Hi!%20I\'d%20like%20a%20custom%20proposal%20quote." target="_blank" onclick="if(typeof gtag===\'function\')gtag(\'event\',\'custom_quote_clicked\',{step:S.step})">Request a custom quote</a></div>';

  if(S.step<3)h+='<div class="inc"><strong>Always included:</strong> Elegant candlelight &amp; atmospheric lighting, professional on-site styling, phone photo &amp; video by our team, personalised music from speaker, champagne.</div>';

  a.innerHTML=h;
}

function calHTML(){
  var y=S.cY,m=S.cM,f=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  var td=new Date();td.setHours(0,0,0,0);
  var h='<div class="cal"><div class="ch"><button onclick="cP()">‹</button><span>'+MO[m]+' '+y+'</span><button onclick="cN()">›</button></div><div class="cg">';
  DW.forEach(function(d){h+='<div class="cw">'+d+'</div>';});
  for(var i=0;i<f;i++)h+='<div class="dy" style="cursor:default"></div>';
  for(var d=1;d<=dim;d++){
    var dt=new Date(y,m,d);
    var dis=dt<td;
    var sel=S.dates.some(function(sd){return sd.getTime()===dt.getTime()});
    h+='<div class="dy'+(dis?" di":"")+(sel?" ds":"")+'" '+(dis?'':'onclick="tD('+y+','+m+','+d+')"')+'>'+d+'</div>';
  }
  h+='</div></div>';
  return h;
}

function pD(id){
  var d=D.filter(function(d){return d.id===id})[0];
  S.decor=d;
  if(!d.variants)d.variant=null;
  render();
}
function sV(id,v){
  var d=D.filter(function(d){return d.id===id})[0];
  d.variant=v;
  S.decor=d;
  render();
}
function pL(id){S.loc=L.filter(function(l){return l.id===id})[0];if(S.loc.pub)S.extras=S.extras.filter(function(e){return e.id!=="cold-spark"});render();}
function tE(id){
  var ex=E.filter(function(e){return e.id===id})[0];
  if(S.extras.filter(function(e){return e.id===id}).length)S.extras=S.extras.filter(function(e){return e.id!==id});
  else S.extras.push(ex);
  render();
}
function tD(y,m,d){
  var dt=new Date(y,m,d);
  var idx=-1;
  S.dates.forEach(function(sd,i){if(sd.getTime()===dt.getTime())idx=i;});
  if(idx>=0)S.dates.splice(idx,1);else S.dates.push(dt);
  render();
}
function cP(){if(S.cM===0){S.cM=11;S.cY--;}else S.cM--;render();}
function cN(){if(S.cM===11){S.cM=0;S.cY++;}else S.cM++;render();}
function nx(){if(ok()){S.step++;if(typeof gtag==='function'){var steps=['decoration_selected','location_selected','extras_selected','summary_viewed'];gtag('event',steps[S.step-1],{decoration:S.decor?S.decor.name:'',location:S.loc?S.loc.name:'',extras_count:S.extras.length,total:tot()});}render();window.scrollTo(0,0);}}
function bk(){S.step--;render();window.scrollTo(0,0);}
function ub(){var b=document.getElementById("nb");if(b)b.disabled=!ok();}

function sub(){
  if(!ok()||S.sending)return;
  S.sending=true;render();
  if(typeof gtag==='function')gtag('event','proposal_submitted',{decoration:S.decor.name,location:S.loc.name,extras:S.extras.map(function(e){return e.name}).join(','),total:tot()});
  var di=disc();
  var p={
    name:S.form.name,
    email:S.form.email,
    phone:S.form.phone||"Not provided",
    date:fds(S.dates),
    decoration:S.decor.name+(S.decor.variant?' ('+S.decor.variant+')':'')+" — "+fm(S.decor.price),
    location:S.loc.name+" — "+S.loc.pl,
    extras:S.extras.length?S.extras.map(function(e){var isD=di.id===e.id;return e.name+" ("+fm(isD?Math.round(e.price/2):e.price)+")"+(isD?" [50% OFF]":"")}).join(", "):"None",
    total:fm(tot()),
    message:S.form.msg||"No additional notes"
  };
  emailjs.send("service_u02wwwx","template_6dtrntf",p)
    .then(function(){S.done=true;S.sending=false;render();window.scrollTo(0,0);try{window.parent.postMessage({type:'pib-lead'},'*');}catch(e){}})
    .catch(function(err){S.sending=false;render();alert("Something went wrong. Please try again or contact us via WhatsApp.");console.error(err);});
}

render();
